services:

  backend:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ragchat:ragchat@postgres:5432/ragchat
    depends_on:
      - postgres
    command: >
        sh -c "pip install uv &&
        uv sync --no-dev &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat

    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ragchat -d ragchat"]
     interval: 5s
     timeout: 5s
     retries: 10

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"


volumes:
  postgres_data:
  frontend_node_modules: